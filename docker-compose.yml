version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planeacion_postgres_v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sistema_planeacion}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      # Ejecuta automáticamente al crear la base los scripts 01-schema, 02-indexes y 03-seed
      - ./Database:/docker-entrypoint-initdb.d:ro
    networks:
      - planeacion_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sistema_planeacion}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeacion_backend_v2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sistema_planeacion}
      - JWT_SECRET=${JWT_SECRET:-super_secreto_para_planeacion_cambiar_en_produccion}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - planeacion_network

volumes:
  postgres_data_v2:
    driver: local

networks:
  planeacion_network:
    driver: bridge
